<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/twab_style.css">
    <link rel="icon" type="image/png" href="resources/groogle.png">
    <title>OCE Faceitle</title>
    <style>
        .fancybutton {
            width: calc(490px - 400px);
            height: 35px;
            margin: 0;
            padding: 0;
            border: none;
            background-color: rgb(190, 124, 1);
            font-size: large;
        }
        .fancybutton:hover {
            background-color: rgb(207, 135, 0);
        }
        .guess {
            display: flex;
            flex-direction: row;
            margin: 10px 0 10px 0;
        }
        .player {
            color:rgb(251, 255, 227);
            height: 45px;
            align-items: center;
            line-height: 45px;
            margin: 0 10px 0 10px;
            padding: 0 0 0 10px;
            border-radius: 4px;
            cursor: pointer ;
        }
        .player:hover {
            background-color: #494949;
        }
        .name {
            color: rgb(251, 255, 227);
            text-align: center;
            line-height: 75px;
            font-size: xx-large;
            width:300px;
            height: 75px;
            background-color:  #4f4f4f;
            border-radius: 5px;
            margin:  0 10px;
        }
        .dropdown {
            margin-top: 10px;
        }
        .team {
            text-align: center;
            text-wrap: wrap;
            overflow-wrap: break-word;
            color: rgb(251, 255, 227);
        }
        .correct {
            background-color: #35af5e !important;
        }
        .incorrect {
            background-color: #972c2c !important;
        }
        .smallinput {
            width:75px;
            height: 75px;
            background-color:  #4f4f4f;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
        }
        .copybutton {
            background-color: rgb(190, 124, 1);
            font-size: large;
            border: none;
            height: 50px;
        }
        .copybutton:hover {
            background-color: rgb(207, 135, 0);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="home" href="/index">Home</a>
    </div>

    <div class="groogle-text" style="margin: 0 0 50px 0;">
        <span>OCE Masters Faceitle</span>
    </div>
    <div style="display: flex; width: 100%; justify-content: center; align-items: center; flex-direction: column;">
        <div class="answer-box" style="width:490px; background-color: #2f2f2f; border-radius: 15px; padding: 20px; border: 1px solid #4f4f4f; margin: 0 0 20px 0">
            <div class="guess unanswered" ><div class="name" ></div><div class="role smallinput" ></div><div class="team smallinput"></div></div>
            <div class="guess unanswered" ><div class="name" ></div><div class="role smallinput" ></div><div class="team smallinput" ></div></div>
            <div class="guess unanswered" ><div class="name" ></div><div class="role smallinput" ></div><div class="team smallinput" ></div></div>
            <div class="guess unanswered" ><div class="name" ></div><div class="role smallinput" ></div><div class="team smallinput" ></div></div>
            <div class="guess unanswered" ><div class="name" ></div><div class="role smallinput" ></div><div class="team smallinput" ></div></div>
            <div class="guess unanswered" ><div class="name" ></div><div class="role smallinput" ></div><div class="team smallinput" ></div></div>
            <div class="guess unanswered" ><div class="name" ></div><div class="role smallinput" ></div><div class="team smallinput" ></div></div>
        </div>
        <div id="iholdstuff" style="width:490px; background-color: #2f2f2f; border-radius: 15px; font-size: large; border: 1px solid #4f4f4f; overflow: hidden; padding: 10px 0 10px;">
            <div style="align-items: center; justify-content: left; display: flex;">
                <input type="text" id="search" placeholder="Search for a player" style="background-color: inherit; border: none; height: 35px; padding: 0; width: 400px; margin: 0 0 0 20px">
                <button class="fancybutton" onclick="submitGuess(event)">Guess</button>
            </div>
        <div class="dropdown" id="dropdown"></div>
    </div>
    <div id="completion" style="background-color: #4f4f4f; text-align: center; padding: 10px; border-radius: 8px; display: none;">
        <h1 id="result"></h1>
        <p>The correct answer was: <code id="player_name">PLAYER_NAME</code></p>
        <p>reset at midnight local time</p>
        <button class="copybutton" onclick="copyresults()">Copy Results to Clipboard</button>
    </div>
</body>

<script>
    const dmg = '<svg width="65" class="fill-white opacity-90 h-full w-full" height="65" viewBox="0 0 60.325 60.325" xmlns="http://www.w3.org/2000/svg"><title>Damage</title><path d="m36.451 58.73v-9.6006h-12.577v9.6006zm0-12.997v-34.224c0-5.2977-5.0459-9.8967-6.2886-9.8967s-6.2886 4.599-6.2886 9.8967v34.224zm18.777 12.997v-9.6006h-12.577v9.6006zm0-12.997v-34.224c0-5.2977-5.0459-9.8967-6.2886-9.8967s-6.2886 4.599-6.2886 9.8967v34.224zm-37.553 12.997v-9.6006h-12.577v9.6006zm0-12.997v-34.224c0-5.2977-5.0459-9.8967-6.2886-9.8967s-6.2886 4.599-6.2886 9.8967v34.224z"></path></svg>';
    const sup = '<svg width="65" class="fill-white opacity-90 h-full w-full" height="65" viewBox="0 0 60.325 60.325" xmlns="http://www.w3.org/2000/svg"><title>Support</title><path d="m40.777 54.38c0 1.8962-1.6187 4.3473-3.6536 4.3473h-13.922c-2.0349 0-3.6536-2.4511-3.6536-4.3473v-13.597h-13.597c-1.8962 0-4.3473-1.6187-4.3473-3.6536v-13.922c0-2.0349 2.4511-3.6536 4.3473-3.6536h13.597v-13.597c0-1.8962 1.6187-4.3473 3.6536-4.3473h13.922c2.0349 0 3.6536 2.4511 3.6536 4.3473v13.597h13.597c1.8962 0 4.3473 1.6187 4.3473 3.6536v13.922c0 2.0349-2.4511 3.6536-4.3473 3.6536h-13.597z"></path></svg>';
    const tank = '<svg width="65" class="fill-white opacity-90 h-full w-full" height="65" viewBox="0 0 60.325 60.325" xmlns="http://www.w3.org/2000/svg"><title>Tank</title><path d="m5.4398 34.59v-24.069c0-3.8588 8.0447-8.9157 24.723-8.9157 16.678 0 24.723 5.0568 24.723 8.9157v24.069c0 5.821-19.817 24.133-24.723 24.133-4.9053 0-24.723-18.312-24.723-24.133z"></path></svg>';
    const roles = {"damage": dmg, "support": sup, "tank": tank};
    function SeedRandom(state1,state2){
        var mod1=4294967087
        var mul1=65539
        var mod2=4294965887
        var mul2=65537
        if(typeof state1!="number"){
            state1=+new Date()
        }
        if(typeof state2!="number"){
            state2=state1
        }
        state1=state1%(mod1-1)+1
        state2=state2%(mod2-1)+1
        function random(limit){
            state1=(state1*mul1)%mod1
            state2=(state2*mul2)%mod2
            if(state1<limit && state2<limit && state1<mod1%limit && state2<mod2%limit){
                return random(limit)
            }
            return (state1+state2)%limit
        }
        return random
    }

    const picks = {"AUTUMN_ow":{"team":"Paris","role":"tank"},"Aerial":{"team":"Onions On Sale","role":"support"},"Alimo":{"team":"Onions On Sale","role":"tank"},"Arc":{"team":"Pepeino Rodrigo","role":"damage"},"Beeple":{"team":"Untersirables","role":"support"},"BiscuitBoy":{"team":"Untersirables","role":"tank"},"Bread":{"team":"Crazy Cats","role":"tank"},"BreadTurtle_":{"team":"The Bakery","role":"support"},"Bunny":{"team":"Supernova","role":"damage"},"Chappadoodle":{"team":"Supernova","role":"tank"},"Constantine":{"team":"Crazy Cats","role":"damage"},"DML":{"team":"FURY","role":"damage"},"Diego":{"team":"Paris","role":"damage"},"Diorite":{"team":"The Minerals","role":"support"},"Dizzly":{"team":"Pepeino Rodrigo","role":"damage"},"Estreichh":{"team":"FURY","role":"tank"},"Exrai":{"team":"FURY","role":"support"},"Final":{"team":"Onions On Sale","role":"support"},"Fovai":{"team":"Untersirables","role":"support"},"FrostyCookie":{"team":"The Minerals","role":"tank"},"GP2Engine":{"team":"Untersirables","role":"support"},"HeyHello":{"team":"Team Excel","role":"support"},"Huntin":{"team":"The Bakery","role":"support"},"Kaistro":{"team":"Team Excel","role":"support"},"LegoEater":{"team":"The Minerals","role":"damage"},"Lex":{"team":"Paris","role":"damage"},"LiamFox":{"team":"Supernova","role":"support"},"Luke":{"team":"Paris","role":"support"},"Maltma":{"team":"FURY","role":"support"},"Muttnik":{"team":"Supernova","role":"support"},"PKFishy":{"team":"The Bakery","role":"damage"},"Pattoww":{"team":"The Minerals","role":"support"},"PlateOfSuki":{"team":"Untersirables","role":"damage"},"Pugz":{"team":"The Bakery","role":"support"},"RayCenat":{"team":"Team Excel","role":"damage"},"RedChicken81":{"team":"FURY","role":"tank"},"Regr3T":{"team":"The Bakery","role":"damage"},"Reo":{"team":"Pepeino Rodrigo","role":"tank"},"RottenWaltz":{"team":"The Minerals","role":"support"},"S1zzle":{"team":"The Minerals","role":"damage"},"Scorch":{"team":"The Bakery","role":"tank"},"Seatonnes":{"team":"Untersirables","role":"support"},"SlidzorJ":{"team":"Supernova","role":"damage"},"Smashy":{"team":"Onions On Sale","role":"damage"},"TLK":{"team":"Crazy Cats","role":"damage"},"TSML9DOMO":{"team":"Onions On Sale","role":"damage"},"Trick":{"team":"Pepeino Rodrigo","role":"support"},"Tropica":{"team":"AstronicEsports","role":"support"},"WhiteHammer8":{"team":"Paris","role":"support"},"Zoe":{"team":"Paris","role":"tank"},"_Al3c":{"team":"The Minerals","role":"tank"},"_Cas3y_":{"team":"Pepeino Rodrigo","role":"damage"},"eattree":{"team":"Team Excel","role":"tank"},"fun748593746":{"team":"Team Excel","role":"damage"},"hamster":{"team":"FURY","role":"support"},"hewwo":{"team":"Crazy Cats","role":"support"},"ikari2k":{"team":"FURY","role":"damage"},"kawhi":{"team":"Untersirables","role":"damage"},"lain":{"team":"Onions On Sale","role":"damage"},"lilgooba":{"team":"FURY","role":"damage"},"luckyduck1":{"team":"Team Excel","role":"damage"},"markER":{"team":"Pepeino Rodrigo","role":"support"},"nuclear":{"team":"Untersirables","role":"tank"},"shkyp":{"team":"FURY","role":"damage"},"smaxow":{"team":"The Minerals","role":"support"},"sno6":{"team":"Pepeino Rodrigo","role":"damage"},"suna233":{"team":"Paris","role":"tank"},"swaqqyy":{"team":"Untersirables","role":"tank"},"vanityrose":{"team":"Crazy Cats","role":"support"},"yeoxnw00":{"team":"Paris","role":"support"},"ytb_":{"team":"Onions On Sale","role":"support"}}
    const keys = Object.keys(picks);
    const keys_lower = new Array();
    for (i of keys) {
        keys_lower.push(i.toLowerCase());
    }
    const date = new Date();
    const date_seed = new Date((date.getYear() + 1900), date.getMonth(), date.getDate()).getTime();
    const player = keys[SeedRandom(date_seed)(keys.length)];
    const dropdown = document.getElementById("dropdown");
    for (let i = 0; i < keys.length; i++) {
        let temp_element = document.createElement("div");
        temp_element.classList = "player";
        temp_element.innerText = keys[i];
        temp_element.onclick = onPlayerClick;
        dropdown.appendChild(temp_element);
    }


    const guessed = new Array();

    const search_bar = document.getElementById("search");

    function inputHandler(event) {
        const children = dropdown.getElementsByClassName("player");
        const c_keys = Object.keys(children);
        for (let i = 0; i < c_keys.length; i++) {
            let node = children[c_keys[i]];
            if (node.innerText.toLowerCase().includes(search_bar.value.toLowerCase()))
            {
                node.style.display = "block";
            } else {
                node.style.display = "none";
            }
        }
    }
    search_bar.addEventListener("keyup", inputHandler)

    function onPlayerClick(event) {
        console.log(event.innerText);
        search_bar.value = event.target.innerText;
        inputHandler(event);
    }
    let lastguess = "";

    function submitGuess(event) {
        const value = search_bar.value.toLowerCase();
        const guesses_left = document.getElementsByClassName("unanswered");
        const guess_keys = Object.keys(guesses_left);
        if (keys_lower.includes(value) && !guessed.includes(value) && guess_keys.length > 0 && !lastguess) {
            console.log(search_bar.value);
            guessed.push(value);
            const player_name = keys[keys_lower.indexOf(value)];
            guesses_left[0].childNodes[0].innerText = player_name;
            guesses_left[0].childNodes[0].classList.add((player_name == player ? "correct" : "incorrect"))
            guesses_left[0].childNodes[1].innerHTML = roles[picks[player_name].role];
            guesses_left[0].childNodes[1].classList.add((picks[player_name].role == picks[player].role ? "correct" : "incorrect"))
            guesses_left[0].childNodes[2].innerText = picks[player_name].team;
            guesses_left[0].childNodes[2].classList.add((picks[player_name].team == picks[player].team ? "correct" : "incorrect"))
            guesses_left[0].classList.add("answered");
            guesses_left[0].classList.remove("unanswered");
            lastguess = (player_name == player);
            search_bar.value = "";
            inputHandler(event);
        }
        if (guesses_left.length == 0) {
            document.getElementById("iholdstuff").style.display = "none";
            document.getElementById("completion").style.display = "block";
            document.getElementById("result").innerText = (lastguess ? "You Won!" : "You Lost...");
            document.getElementById("player_name").innerText = player;

        }
        
    }

    function copyresults() {
        let copied_string = "OCE MASTERS FACEITLE " + date.getDate() + "-" + date.getMonth() + " " + (lastguess ? "✔️" : "❌") + "\n";
        const guesses = document.getElementsByClassName("answered");
        for (let i of guesses) {
            copied_string += (i.childNodes[0].classList.contains("correct") ? "🟩" : "🟥");
            copied_string += (i.childNodes[1].classList.contains("correct") ? "🟩" : "🟥");
            copied_string += (i.childNodes[2].classList.contains("correct") ? "🟩" : "🟥") + "\n";
        }
        copied_string += "<https://groogle.zip/ocefaceitle>";
        navigator.clipboard.writeText(copied_string);
    }


</script>
